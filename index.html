<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#05030b">

    <title>My Lovely Gaby ♥</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading -->
    <div id="loading">
        <div class="loading-star">✦</div>
        <p>Menyiapkan galaksi untuk Gaby...</p>
    </div>

    <!-- Tempat galaksi 3D -->
    <div id="scene"></div>

    <!-- Efek gelap di pinggir layar -->
    <div class="vignette"></div>

    <!-- Judul -->
    <header class="top-copy">

        <p class="eyebrow">
            A LITTLE UNIVERSE MADE JUST FOR YOU
        </p>

        <h1>
            My Lovely <span>Gaby</span>
            <b>♥</b>
        </h1>

        <p class="subtitle">
            Di antara miliaran bintang,
            ada satu nama yang istimewa.
        </p>

    </header>


    <!-- Tulisan bawah -->
    <footer class="bottom-copy">

        <span class="tiny-star">✦</span>

        <p class="small-title">
            MY LITTLE GALAXY
        </p>

        <h2>
            Only for you, Gaby <span>♡</span>
        </h2>

        <p class="hint">
            Geser untuk melihat galaksi.
            Sentuh foto untuk memperbesarnya.
        </p>

    </footer>


    <!-- Tampilan foto besar -->
    <div id="photo-viewer" class="photo-viewer">

        <button id="close-viewer" aria-label="Tutup foto">
            ×
        </button>

        <img id="large-photo" alt="Foto Gaby">

        <p id="photo-caption">
            A lovely memory ♡
        </p>

    </div>


    <!-- JavaScript 3D -->
    <script type="module" src="script.js"></script>

</body>
</html>
